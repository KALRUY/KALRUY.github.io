paginate_path: "/page/:num/"  # minima 分页默认路径，显式声明更清晰

# 主题设置（指定 minima）
theme: minima

# 自定义变量
version: 2.1.0

# 第三方链接
github:
  repo: https://github.com/kalruy/kalruy.github.io