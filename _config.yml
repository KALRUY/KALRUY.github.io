# 核心站点配置
title: KALRUY's Blog
tagline: 'C++ , network'
description: '兴趣,专注,行动力.'
url: https://KALRUY.github.io  # 补充完整的 URL 协议头，避免路径错误
baseurl: /                     # 根目录部署保持为 / 即可

# 作者信息
author:
  name: KALRUY
  github: https://github.com/kalruy  # 补充作者 GitHub 地址（可选）

# 分页配置
